[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grs-iq-rx-usrp"
version = "0.1.0"
description = "Receptor USRP (python3-uhd) do grs-iq-rx, com painel de configuração"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }

# `uhd` NÃO está aqui: no Linux ele só existe via apt (python3-uhd); o PyPI
# só publica wheel para Windows.
#
# numpy<2 é obrigatório: a extensão compilada do python3-uhd do Debian
# (libpyuhd) foi construída contra a C-API do NumPy 1.x, e com numpy 2.x o
# `import uhd` falha com "AttributeError: _ARRAY_API not found" — confirmado.
dependencies = [
    "numpy>=1.26,<2",
    "pyzmq>=25,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grs_iq_rx_usrp = ["panel.html"]
